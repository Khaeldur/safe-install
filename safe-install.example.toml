# safe-install configuration
# Copy to ~/.config/safe-install/config.toml (global)
# or ./safe-install.toml (per-project)

[sandbox]
enabled = true
memory_limit = "2g"
cpu_limit = "2"
timeout = 600      # seconds

[vault]
# Add paths beyond the built-in list of ~30 sensitive locations
extra_paths = [
    # "~/.my-app/secrets.json",
    # "~/.config/my-tool/credentials",
]
# Add env vars beyond the built-in list of ~40 sensitive vars
extra_env_vars = [
    # "MY_SECRET_KEY",
    # "INTERNAL_API_TOKEN",
]

[network]
# Hosts to allow during install (in addition to PyPI, npm, etc.)
allowed_hosts = [
    # "my-private-registry.company.com",
    # "artifactory.internal.net",
]
# Set to true to block ALL network during install (requires sandbox)
block_all = false

[scan]
skip_tests = true          # Skip test directories during source scan
max_findings_display = 15  # Cap findings shown per severity level
